services:
  api:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/processed:/app/data/processed
      - ./app:/app/app
    env_file:
      - .env
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage